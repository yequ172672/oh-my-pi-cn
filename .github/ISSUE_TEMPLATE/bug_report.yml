name: Bug 报告
description: 报告可复现的错误、崩溃或安装问题
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请删除或遮盖 API Key、账号、私人仓库、个人路径和会话内容。
        如果问题同样存在于官方 can1357/oh-my-pi，请在下方注明。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？它对使用造成了什么影响？
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请提供能稳定复现问题的最小步骤。
      placeholder: |
        1. 执行……
        2. 选择……
        3. 出现……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正常情况下应该发生什么？
    validations:
      required: true

  - type: textarea
    id: error-output
    attributes:
      label: 错误输出
      description: 粘贴已经移除敏感信息的错误消息或堆栈。
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: 平台
      options:
        - macOS
        - Linux
        - Windows（原生）
        - Windows（WSL）
        - Alpine / musl
        - 其他
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: 安装方式
      options:
        - npm
        - Bun
        - 安装脚本
        - GitHub Release 二进制
        - mise
        - 源码
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: omp 版本
      description: 请粘贴 `omp --version` 的完整输出。
      placeholder: "例如：omp/17.2.12"
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun 版本
      description: 如果已安装 Bun，请粘贴 `bun --version` 输出。

  - type: dropdown
    id: provider
    attributes:
      label: 供应商
      description: 如果问题与供应商无关，可选择“不适用”。
      options:
        - 不适用
        - Anthropic（Claude Pro/Max）
        - ChatGPT Plus/Pro（Codex）
        - GitHub Copilot
        - Google Cloud Code Assist（Gemini CLI）
        - Antigravity
        - Cursor
        - OpenCode Zen
        - Kimi Code
        - Z.AI（GLM）
        - MiniMax Coding Plan
        - Perplexity
        - Amazon Bedrock
        - OpenRouter
        - Ollama / 本地模型
        - 自定义（models.yml）
        - 其他
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 中文本地化
        - TUI / 显示
        - 安装 / 更新
        - 身份验证 / 登录
        - 模型选择
        - 工具执行
        - MCP 服务
        - 扩展 / 插件
        - CLI 命令
        - 会话 / 压缩
        - 其他
    validations:
      required: true

  - type: dropdown
    id: upstream
    attributes:
      label: 上游版本是否同样出现
      description: 如果尚未验证，请选择“未验证”。
      options:
        - 未验证
        - 是，官方版本也会出现
        - 否，仅 omp-cn 出现
        - 不适用
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息
      description: 可提供已脱敏的截图、配置片段或相关链接。

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同报告。
          required: true
        - label: 我已移除密钥、账号、私人路径和会话隐私。
          required: true

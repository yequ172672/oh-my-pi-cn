name: Fork CI

on:
   push:
      branches: [main]
      tags: ["omp-cn-v*"]
   pull_request:
      branches: [main]
   workflow_dispatch:
      inputs:
         release_tag:
            description: "Existing omp-cn-v* tag to publish; leave empty for validation only"
            required: false
            type: string

permissions:
   contents: read

concurrency:
   group: "${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/omp-cn-v') && github.ref_name || inputs.release_tag || github.ref }}"
   cancel-in-progress: "${{ !startsWith(github.ref, 'refs/tags/omp-cn-v') && inputs.release_tag == '' }}"

env:
   FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
   resolve:
      name: Resolve validation and release SHA
      runs-on: ubuntu-22.04
      outputs:
         is-release: ${{ steps.resolve.outputs.is-release }}
         release-tag: ${{ steps.resolve.outputs.release-tag }}
         release-version: ${{ steps.resolve.outputs.release-version }}
         sha: ${{ steps.resolve.outputs.sha }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              fetch-depth: 0
         - uses: ./.github/actions/bun-install
         - name: Validate release identity
           id: resolve
           shell: bash
           env:
              DISPATCH_TAG: ${{ inputs.release_tag }}
           run: |
              set -euo pipefail
              is_release=false
              release_tag=""
              release_version=""
              validation_sha="$GITHUB_SHA"

              if [[ "$GITHUB_REF" == refs/tags/omp-cn-v* ]]; then
                release_tag="$GITHUB_REF_NAME"
              elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$DISPATCH_TAG" ]]; then
                release_tag="$DISPATCH_TAG"
              fi

              if [[ -n "$release_tag" ]]; then
                release_version="$(bun -e 'import { parseStableForkReleaseTag } from "./scripts/fork-release-identity.ts"; process.stdout.write(parseStableForkReleaseTag(process.argv[1] ?? ""))' "$release_tag")"
                git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
                git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
                tag_sha="$(git rev-parse "$release_tag^{}")"
                main_sha="$(git rev-parse refs/remotes/origin/main)"
                git merge-base --is-ancestor "$tag_sha" "$main_sha" || {
                  echo "Release tag $release_tag at $tag_sha is not an ancestor of origin/main $main_sha" >&2
                  exit 1
                }
                metadata_version="$(git show "$tag_sha:packages/coding-agent/fork-release.json" | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => process.stdout.write(JSON.parse(input).forkVersion))')"
                [[ "$release_version" == "$metadata_version" ]] || {
                  echo "Release tag version $release_version does not match fork-release.json $metadata_version" >&2
                  exit 1
                }
                release_subject="$(git show -s --format=%s "$tag_sha")"
                [[ "$release_subject" == "chore(fork): release omp-cn $release_version" ]] || {
                  echo "Release commit subject is not the expected fork release transaction: $release_subject" >&2
                  exit 1
                }
                is_release=true
                validation_sha="$tag_sha"
              fi

              {
                echo "is-release=$is_release"
                echo "release-tag=$release_tag"
                echo "release-version=$release_version"
                echo "sha=$validation_sha"
              } >> "$GITHUB_OUTPUT"

   native_addons:
      name: Fetch exact upstream native addons
      needs: [resolve]
      runs-on: ubuntu-22.04
      timeout-minutes: 10
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/setup-system-deps
         - name: Download and validate native package
           shell: bash
           run: |
              set -euo pipefail
              native_version="$(bun -e 'const manifest = await Bun.file("packages/natives/package.json").json(); process.stdout.write(manifest.version)')"
              metadata_native_version="$(bun -e 'const metadata = await Bun.file("packages/coding-agent/fork-release.json").json(); process.stdout.write(metadata.nativeVersion)')"
              [[ "$native_version" == "$metadata_native_version" ]] || {
                echo "Native manifest $native_version does not match fork metadata $metadata_native_version" >&2
                exit 1
              }
              for leaf in pi-natives pi-natives-linux-x64 pi-natives-linux-arm64 pi-natives-darwin-x64 pi-natives-darwin-arm64 pi-natives-win32-x64; do
                published="$(npm view "@oh-my-pi/${leaf}@${native_version}" version)"
                [[ "$published" == "$native_version" ]] || {
                  echo "Missing exact native dependency @oh-my-pi/${leaf}@${native_version}" >&2
                  exit 1
                }
              done
              package="@oh-my-pi/pi-natives-linux-x64@${native_version}"
              tarball="$(npm view "$package" dist.tarball)"
              test -n "$tarball"
              mkdir -p "$RUNNER_TEMP/omp-native" \
                bazel-bin/natives-linux-x64-baseline \
                bazel-bin/natives-linux-x64-modern
              curl -fsSL --retry 3 "$tarball" | tar -xz -C "$RUNNER_TEMP/omp-native"
              cp "$RUNNER_TEMP/omp-native/package/pi_natives.linux-x64-baseline.node" bazel-bin/natives-linux-x64-baseline/
              cp "$RUNNER_TEMP/omp-native/package/pi_natives.linux-x64-modern.node" bazel-bin/natives-linux-x64-modern/
              node -e 'for (const f of process.argv.slice(1)) require(f)' \
                "$PWD/bazel-bin/natives-linux-x64-baseline/pi_natives.linux-x64-baseline.node" \
                "$PWD/bazel-bin/natives-linux-x64-modern/pi_natives.linux-x64-modern.node"
         - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: native-addons
              path: bazel-bin/natives-*/*.node
              if-no-files-found: error
              retention-days: 1

   rust_validate:
      name: Validate hosted Rust workspace (limited)
      needs: [resolve]
      runs-on: ubuntu-22.04
      timeout-minutes: 60
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/bun-install
         - id: cache
           uses: ./.github/actions/bazel-cache
           with:
              scope: fork-rust
         - name: Rust tests
           run: |
              if [ "$(ulimit -Sn)" != unlimited ] && [ "$(ulimit -Sn)" -lt 65536 ]; then ulimit -Sn 65536 || true; fi
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test -- \
                //crates/... -//crates/pi-shell:pi-shell_test
              # GitHub-hosted Linux does not deliver the stopped-pipeline state
              # required by this one jobspec contract, even without Bazel's
              # sandbox. Run every other pi-shell test and record the exception
              # in docs/MAINTENANCE.md rather than reporting a full Rust matrix.
              bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" test \
                --test_arg=--skip \
                --test_arg=shell::tests::kill_builtin_signals_every_process_in_a_jobspec_pipeline \
                -- //crates/pi-shell:pi-shell_test
         - name: Clippy
           run: |
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-ast/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-voice/... + //crates/pi-walker/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-strict --
              bazelisk query "kind('rust_library|rust_shared_library', //crates/... - (//crates/pi-ast/... + //crates/pi-iso/... + //crates/pi-natives/... + //crates/pi-shell/... + //crates/pi-voice/... + //crates/pi-walker/...) - //crates/pi-builtins/... - //crates/vendor/brush-core/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy --
              bazelisk query "kind('rust_library|rust_shared_library', //crates/pi-builtins/...)" \
                | xargs bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=clippy-ported --
         - name: Rustfmt
           run: bazelisk --bazelrc="${{ steps.cache.outputs.rc }}" build --config=rustfmt //crates/...
         - name: Save Rust cache
           if: steps.cache.outputs.save-needed == 'true'
           uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
           with:
              path: |
                 ~/.cache/omp-bazel-disk
                 ~/.cache/omp-bazel-repo
              key: ${{ steps.cache.outputs.cache-key }}

   validate:
      name: Validate Chinese fork
      needs: [resolve, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 35
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern

         - name: Type check, lint, and build web workspace
           run: |
              bun run ci:check:full
              bun run collab:web:build

         - name: Test fork-specific contracts
           run: |
              bun test --parallel=1 \
                packages/coding-agent/test/i18n.test.ts \
                packages/coding-agent/test/distribution.test.ts \
                packages/coding-agent/test/update-cli.test.ts \
                scripts/install-fork.test.ts \
                scripts/musl-release.test.ts \
                scripts/publish-fork-package.test.ts \
                scripts/release-fork.test.ts \
                scripts/fork-release-notes.test.ts

         - name: Test CLI runtime and bundled workers
           run: bun run ci:test:smoke

         - name: Verify fork package artifact
           run: bun run publish:fork:dry --skip-check

         - name: Assert verification restored tracked files
           run: git diff --exit-code

   test_workspace:
      name: Test TypeScript workspace
      needs: [resolve, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - run: bun run ci:test:ts:workspace

   test_coding_agent_ui:
      name: Test coding-agent UI and TUI
      needs: [resolve, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - run: bun run ci:test:coding-agent:ui

   test_coding_agent_runtime:
      name: Test coding-agent runtime
      needs: [resolve, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - run: bun run ci:test:coding-agent:runtime

   test_coding_agent_singleton:
      name: Test coding-agent singleton and global state
      needs: [resolve, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - run: bun run ci:test:coding-agent:singleton

   test_ts_native:
      name: Test TS native and integration packages
      needs: [resolve, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 30
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - run: bun run ci:test:ts:native
           env:
              OMP_TEST_CONCURRENCY: "4"

   test_coding_agent_native:
      name: Test coding-agent native paths
      needs: [resolve, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 35
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - run: bun run ci:test:coding-agent:native
           env:
              OMP_TEST_CONCURRENCY: "4"
              OMP_TEST_CHUNK_TIMEOUT: "1200"

   install_methods:
      name: Test supported install methods
      needs: [resolve, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 45
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - run: bun run ci:test:install-methods
           env:
              OMP_INSTALL_TEST_SKIP_NATIVE_BUILD: "1"

   release_gate:
      name: Fork release validation gate
      if: >-
         ${{ needs.resolve.outputs.is-release == 'true' && !cancelled() &&
         needs.validate.result == 'success' && needs.rust_validate.result == 'success' &&
         needs.test_workspace.result == 'success' && needs.test_coding_agent_singleton.result == 'success' &&
         needs.test_ts_native.result == 'success' && needs.test_coding_agent_ui.result == 'success' &&
         needs.test_coding_agent_runtime.result == 'success' && needs.test_coding_agent_native.result == 'success' &&
         needs.install_methods.result == 'success' }}
      needs: [resolve, validate, rust_validate, test_workspace, test_coding_agent_singleton, test_ts_native, test_coding_agent_ui, test_coding_agent_runtime, test_coding_agent_native, install_methods]
      runs-on: ubuntu-22.04
      steps:
         - run: echo "fork release validation green"

   release_package:
      name: Pack the verified omp-cn tarball
      if: needs.resolve.outputs.is-release == 'true'
      needs: [resolve, release_gate, native_addons]
      runs-on: ubuntu-22.04
      timeout-minutes: 25
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: ./.github/actions/bun-install
         - uses: ./.github/actions/setup-system-deps
         - uses: ./.github/actions/native-artifacts
           with:
              targets: linux-x64-baseline linux-x64-modern
         - name: Pack and isolated-install smoke the release tarball
           run: bun scripts/publish-fork-package.ts --pack --output release-package
         - name: Upload the exact npm artifact
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-cn-package
              path: release-package/omp-cn-${{ needs.resolve.outputs.release-version }}.tgz
              if-no-files-found: error
              retention-days: 7

   release_binary:
      name: "Build and smoke binary: ${{ matrix.target-id }}"
      if: needs.resolve.outputs.is-release == 'true'
      needs: [resolve, release_gate]
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: ubuntu-22.04
                 target-id: linux-x64
                 platform: linux
                 libc: gnu
                 native-targets: linux-x64-baseline linux-x64-modern
                 binary-path: packages/coding-agent/binaries/omp-linux-x64
               - os: ubuntu-22.04
                 target-id: linux-musl-x64
                 platform: linux
                 libc: musl
                 native-targets: linux-musl-x64-baseline
                 binary-path: packages/coding-agent/binaries/omp-linux-musl-x64
               - os: ubuntu-24.04-arm
                 target-id: linux-arm64
                 platform: linux
                 libc: gnu
                 native-targets: linux-arm64
                 binary-path: packages/coding-agent/binaries/omp-linux-arm64
               - os: ubuntu-24.04-arm
                 target-id: linux-musl-arm64
                 platform: linux
                 libc: musl
                 native-targets: linux-musl-arm64
                 binary-path: packages/coding-agent/binaries/omp-linux-musl-arm64
               - os: ubuntu-22.04
                 target-id: win32-x64
                 platform: win32
                 libc: none
                 native-targets: win32-x64-baseline
                 binary-path: packages/coding-agent/binaries/omp-windows-x64.exe
      runs-on: ${{ matrix.os }}
      timeout-minutes: 90
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3.14"
         - run: bun install --frozen-lockfile
         - name: Build target native addon
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native-targets }}
              cache-scope: fork-release-${{ matrix.target-id }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target-id }}
           run: bun run ci:release:build-binaries
         - name: Smoke glibc release binary
           if: matrix.platform == 'linux' && matrix.libc == 'gnu'
           shell: bash
           run: |
              set -euo pipefail
              runtime_dir="$(mktemp -d)"
              version_output="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary-path }}" --version)"
              [[ "$version_output" == "omp/${{ needs.resolve.outputs.release-version }}" ]]
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary-path }}" --smoke-test
         - name: Smoke musl release binary on Alpine
           if: matrix.libc == 'musl'
           shell: bash
           run: |
              set -euo pipefail
              binary="$(realpath "${{ matrix.binary-path }}")"
              docker run --rm -e EXPECTED_VERSION="omp/${{ needs.resolve.outputs.release-version }}" \
                -v "$binary:/usr/local/bin/omp:ro" alpine:3.22 sh -ec '
                apk add --no-cache libstdc++ libgcc >/dev/null
                runtime_dir="$(mktemp -d)"
                version_output="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --version)"
                [ "$version_output" = "$EXPECTED_VERSION" ]
                HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" omp --smoke-test
              '
         - name: Upload release binary
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target-id }}
              path: ${{ matrix.binary-path }}
              if-no-files-found: error
              retention-days: 7

   release_binary_darwin:
      name: "Build and smoke binary: ${{ matrix.target-id }}"
      if: needs.resolve.outputs.is-release == 'true'
      needs: [resolve, release_gate]
      strategy:
         fail-fast: false
         matrix:
            include:
               - os: macos-15-intel
                 target-id: darwin-x64
                 native-targets: darwin-x64-baseline
                 binary-path: packages/coding-agent/binaries/omp-darwin-x64
               - os: macos-14
                 target-id: darwin-arm64
                 native-targets: darwin-arm64
                 binary-path: packages/coding-agent/binaries/omp-darwin-arm64
      runs-on: ${{ matrix.os }}
      timeout-minutes: 90
      env:
         MACOS_SIGNING: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY != '' }}
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3.14"
         - run: bun install --frozen-lockfile
         - name: Build target native addon
           uses: ./.github/actions/bazel-natives
           with:
              targets: ${{ matrix.native-targets }}
              cache-scope: fork-release-${{ matrix.target-id }}
         - name: Build release binary
           env:
              RELEASE_TARGETS: ${{ matrix.target-id }}
           run: bun run ci:release:build-binaries
         - name: Sign and notarize macOS binary when credentials exist
           if: env.MACOS_SIGNING == 'true'
           env:
              APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
              APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
              APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
              APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
           run: bash scripts/ci-macos-sign.sh "${{ matrix.binary-path }}"
         - name: Smoke release binary
           shell: bash
           run: |
              set -euo pipefail
              runtime_dir="$(mktemp -d)"
              version_output="$(HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary-path }}" --version)"
              [[ "$version_output" == "omp/${{ needs.resolve.outputs.release-version }}" ]]
              HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary-path }}" --smoke-test
         - name: Upload release binary
           uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
           with:
              name: omp-binary-${{ matrix.target-id }}
              path: ${{ matrix.binary-path }}
              if-no-files-found: error
              retention-days: 7

   verify_windows_binary:
      name: Smoke Windows release binary
      if: needs.resolve.outputs.is-release == 'true'
      needs: [resolve, release_binary]
      runs-on: windows-2025
      timeout-minutes: 15
      steps:
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-binary-win32-x64
              path: release-binary
         - name: Smoke compiled executable
           shell: pwsh
           run: |
              $runtime = Join-Path $env:RUNNER_TEMP "omp-smoke"
              $env:HOME = Join-Path $runtime "home"
              $env:XDG_DATA_HOME = Join-Path $runtime "xdg"
              $versionOutput = (& .\release-binary\omp-windows-x64.exe --version | Out-String).Trim()
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              if ($versionOutput -ne "omp/${{ needs.resolve.outputs.release-version }}") {
                  throw "Unexpected omp version: $versionOutput"
              }
              & .\release-binary\omp-windows-x64.exe --smoke-test
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

   release_draft:
      name: Create verified draft GitHub Release
      if: needs.resolve.outputs.is-release == 'true'
      needs: [resolve, validate, release_package, release_binary, release_binary_darwin, verify_windows_binary]
      runs-on: ubuntu-22.04
      outputs:
         already-complete: ${{ steps.release.outputs.already-complete }}
      permissions:
         contents: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
           with:
              bun-version: "1.3.14"
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              pattern: omp-binary-*
              path: release-assets
              merge-multiple: true
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-cn-package
              path: release-assets
         - name: Generate checksums and fork release notes
           run: |
              set -euo pipefail
              test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 8
              bun run ci:release:checksums release-assets/SHA256SUMS.txt release-assets/omp-*
              bun scripts/fork-release-notes.ts release-notes.md
         - name: Create or refresh draft release
           id: release
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_TAG: ${{ needs.resolve.outputs.release-tag }}
              RELEASE_VERSION: ${{ needs.resolve.outputs.release-version }}
           run: |
              set -euo pipefail
              cat > "$RUNNER_TEMP/expected-assets.txt" <<EOF
              SHA256SUMS.txt
              omp-cn-${RELEASE_VERSION}.tgz
              omp-darwin-arm64
              omp-darwin-x64
              omp-linux-arm64
              omp-linux-musl-arm64
              omp-linux-musl-x64
              omp-linux-x64
              omp-windows-x64.exe
              EOF
              sort -o "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/expected-assets.txt"

              verify_release_assets() {
                local candidate_dir="$1"
                find "$candidate_dir" -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/candidate-assets.txt"
                diff -u "$RUNNER_TEMP/expected-assets.txt" "$RUNNER_TEMP/candidate-assets.txt"
                while IFS= read -r asset; do
                  cmp "release-assets/$asset" "$candidate_dir/$asset"
                done < "$RUNNER_TEMP/expected-assets.txt"
                (cd "$candidate_dir" && sha256sum -c SHA256SUMS.txt)
              }

              if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
                if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == true ]]; then
                  while IFS= read -r stale_asset; do
                    [[ -z "$stale_asset" ]] || gh release delete-asset "$RELEASE_TAG" "$stale_asset" --yes
                  done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
                  gh release edit "$RELEASE_TAG" --title "omp-cn $RELEASE_VERSION" \
                    --notes-file release-notes.md --prerelease=false
                  gh release upload "$RELEASE_TAG" release-assets/*
                  mkdir refreshed-assets
                  gh release download "$RELEASE_TAG" --dir refreshed-assets
                  verify_release_assets refreshed-assets
                  echo "already-complete=false" >> "$GITHUB_OUTPUT"
                else
                  mkdir published-assets
                  gh release download "$RELEASE_TAG" --dir published-assets
                  verify_release_assets published-assets
                  [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" == false ]]
                  [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$RELEASE_TAG" ]]
                  [[ "$(gh release view "$RELEASE_TAG" --json name --jq .name)" == "omp-cn $RELEASE_VERSION" ]]
                  gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/published-notes.md"
                  cmp release-notes.md "$RUNNER_TEMP/published-notes.md"

                  tarball="published-assets/omp-cn-${RELEASE_VERSION}.tgz"
                  tar -xOzf "$tarball" package/package.json > "$RUNNER_TEMP/published-manifest.json"
                  npm view "omp-cn@${RELEASE_VERSION}" version repository ompFork dist.shasum --json \
                    > "$RUNNER_TEMP/registry-manifest.json"
                  PUBLISHED_SHASUM="$(sha1sum "$tarball" | cut -d' ' -f1)" node <<'NODE'
              const assert = require("node:assert/strict");
              const fs = require("node:fs");
              const packed = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/published-manifest.json", "utf8"));
              const registry = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/registry-manifest.json", "utf8"));
              const metadata = JSON.parse(fs.readFileSync("packages/coding-agent/fork-release.json", "utf8"));
              const repository = {
                type: "git",
                url: "git+https://github.com/yequ172672/oh-my-pi-cn.git",
                directory: "packages/coding-agent",
              };
              const ompFork = { ...metadata, releaseTag: `omp-cn-v${metadata.forkVersion}` };
              assert.equal(packed.name, "omp-cn");
              assert.equal(packed.version, process.env.RELEASE_VERSION);
              assert.deepEqual(packed.repository, repository);
              assert.deepEqual(packed.ompFork, ompFork);
              assert.equal(registry.version, process.env.RELEASE_VERSION);
              assert.deepEqual(registry.repository, repository);
              assert.deepEqual(registry.ompFork, ompFork);
              assert.equal(registry["dist.shasum"], process.env.PUBLISHED_SHASUM);
              NODE
                  [[ "$(npm view omp-cn dist-tags.latest)" == "$RELEASE_VERSION" ]]
                  echo "already-complete=true" >> "$GITHUB_OUTPUT"
                  echo "Release $RELEASE_TAG is already public and all GitHub/npm state matches."
                fi
              else
                gh release create "$RELEASE_TAG" --verify-tag --draft \
                  --title "omp-cn $RELEASE_VERSION" --notes-file release-notes.md release-assets/*
                echo "already-complete=false" >> "$GITHUB_OUTPUT"
              fi

   release_npm:
      name: Publish the verified omp-cn tarball
      if: needs.resolve.outputs.is-release == 'true' && needs.release_draft.outputs.already-complete != 'true'
      needs: [resolve, release_draft, release_package]
      runs-on: ubuntu-22.04
      permissions:
         contents: read
         id-token: write
      steps:
         - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
           with:
              ref: ${{ needs.resolve.outputs.sha }}
         - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
           with:
              node-version: "24"
              registry-url: "https://registry.npmjs.org"
         - run: npm install -g npm@11.17.0
         - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
           with:
              name: omp-cn-package
              path: release-package
         - name: Publish only omp-cn
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              RELEASE_VERSION: ${{ needs.resolve.outputs.release-version }}
           run: |
              set -euo pipefail
              tarball="$PWD/release-package/omp-cn-${RELEASE_VERSION}.tgz"
              test -f "$tarball"

              tar -xOzf "$tarball" package/package.json > "$RUNNER_TEMP/local-manifest.json"
              sha1sum "$tarball" | cut -d' ' -f1 > "$RUNNER_TEMP/local-shasum"

              verify_registry() {
                npm view "omp-cn@${RELEASE_VERSION}" version repository ompFork dist.shasum --json > "$RUNNER_TEMP/remote-manifest.json"
                LOCAL_SHASUM="$(cat "$RUNNER_TEMP/local-shasum")" node <<'NODE'
              const assert = require("node:assert/strict");
              const fs = require("node:fs");
              const local = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/local-manifest.json", "utf8"));
              const remote = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/remote-manifest.json", "utf8"));
              const tagMetadata = JSON.parse(
                fs.readFileSync("packages/coding-agent/fork-release.json", "utf8"),
              );
              const expectedRepository = {
                type: "git",
                url: "git+https://github.com/yequ172672/oh-my-pi-cn.git",
                directory: "packages/coding-agent",
              };
              const expectedFork = {
                ...tagMetadata,
                releaseTag: `omp-cn-v${tagMetadata.forkVersion}`,
              };
              assert.equal(local.name, "omp-cn");
              assert.equal(local.version, process.env.RELEASE_VERSION);
              assert.deepEqual(local.repository, expectedRepository);
              assert.deepEqual(local.ompFork, expectedFork);
              assert.equal(remote.version, process.env.RELEASE_VERSION);
              assert.deepEqual(remote.repository, expectedRepository);
              assert.deepEqual(remote.ompFork, expectedFork);
              assert.equal(remote["dist.shasum"], process.env.LOCAL_SHASUM);
              NODE
              }

              if npm view "omp-cn@${RELEASE_VERSION}" version >/dev/null 2>&1; then
                verify_registry
                echo "omp-cn@${RELEASE_VERSION} already matches the tag metadata and verified CI tarball."
              else
                npm publish "$tarball" --access public --provenance
                published=false
                for attempt in 1 2 3 4 5 6; do
                  if npm view "omp-cn@${RELEASE_VERSION}" version >/dev/null 2>&1 && verify_registry; then
                    published=true
                    break
                  fi
                  sleep 10
                done
                [[ "$published" == true ]] || {
                  echo "npm registry did not reproduce the verified omp-cn artifact" >&2
                  exit 1
                }
              fi
              latest_version="$(npm view omp-cn dist-tags.latest)"
              [[ "$latest_version" == "$RELEASE_VERSION" ]] || {
                echo "npm dist-tag latest points to $latest_version, expected $RELEASE_VERSION" >&2
                exit 1
              }

   release_complete:
      name: Publish GitHub Release
      if: >-
         ${{ always() && needs.resolve.outputs.is-release == 'true' && needs.release_draft.result == 'success' &&
         (needs.release_draft.outputs.already-complete == 'true' || needs.release_npm.result == 'success') }}
      needs: [resolve, release_draft, release_npm]
      runs-on: ubuntu-22.04
      permissions:
         contents: write
      steps:
         - name: Promote the verified draft
           if: needs.release_draft.outputs.already-complete != 'true'
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_TAG: ${{ needs.resolve.outputs.release-tag }}
           run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
         - name: Verify the public stable latest release
           env:
              GH_TOKEN: ${{ github.token }}
              RELEASE_TAG: ${{ needs.resolve.outputs.release-tag }}
           run: |
              set -euo pipefail
              [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == false ]]
              [[ "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" == false ]]
              [[ "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" == "$RELEASE_TAG" ]]
              echo "GitHub Release and npm state match the completed fork release transaction."
